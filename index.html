<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group Drive</title>

  <!-- Leaflet's styles (the map library) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <!-- Our own styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SCREEN 1: shown first. Pick a name, then create or join a trip. -->
  <div id="start-screen" class="panel">
    <h1>Group Drive</h1>
    <label for="name-input">Your car's name</label>
    <input id="name-input" type="text" placeholder="e.g. Blue Honda" maxlength="20">

    <!-- app.js shows only one of these two buttons -->
    <button id="create-button">Create a trip</button>
    <button id="join-button" hidden>Join trip</button>

    <p id="start-status" class="status"></p>
  </div>

  <!-- SCREEN 2: shown once you're in a trip. Share link on top, map below. -->
  <div id="trip-screen" hidden>
    <div class="top-bar">
      <input id="share-link" readonly>
      <button id="copy-button">Copy link</button>
    </div>
    <div id="map"></div>
    <p id="location-status" class="status"></p>
  </div>

  <!-- Leaflet's code. Loaded before app.js because app.js uses it. -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Our app. type="module" lets it use "import". -->
  <script type="module" src="app.js"></script>
</body>
</html>
