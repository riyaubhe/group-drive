<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group Drive</title>

  <!-- Cormorant Garamond, a classic serif font from Google Fonts (start screen only) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap">

  <!-- Leaflet's styles (the map library) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <!-- Our own styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SCREEN 1: shown first. Pick a name, then create or join a trip.
       The outer div is the full-screen map background; .panel holds the centered content. -->
  <div id="start-screen">
    <div class="panel">
      <h1>Group Drive</h1>

      <!-- The label is hidden on screen (the placeholder shows instead),
           but screen readers still read it out. -->
      <label for="name-input" class="visually-hidden">Your car's name</label>
      <input id="name-input" type="text" placeholder="Your car’s name" maxlength="20" autocomplete="off">

      <!-- Destination search (only shown when creating a trip).
           It's a <form> so pressing Enter also searches. -->
      <form id="destination-form" class="search-pill">
        <label for="destination-input" class="visually-hidden">Destination</label>
        <input id="destination-input" type="text" placeholder="Where to?" autocomplete="off">
        <button type="submit">Search</button>
      </form>
      <!-- app.js fills this list with search results to pick from -->
      <ul id="destination-results" class="results"></ul>

      <!-- app.js shows only one of these two buttons -->
      <button id="create-button">Create Trip</button>
      <button id="join-button" hidden>Join Trip</button>

      <p id="start-status" class="status"></p>
    </div>
  </div>

  <!-- SCREEN 2: shown once you're in a trip. Share link on top, map below. -->
  <div id="trip-screen" hidden>
    <div class="top-bar">
      <input id="share-link" readonly>
      <button id="copy-button">Copy link</button>
    </div>
    <!-- "Car 2 · 4 min behind": app.js fills this in -->
    <div id="eta-bar" class="eta-bar" hidden></div>
    <!-- "Car B took a different route": shown by app.js when cars split up.
         role="alert" makes screen readers read it out right away. -->
    <div id="split-banner" class="split-banner" role="alert" hidden>
      <span id="split-text"></span>
      <button id="split-close" aria-label="Dismiss alert">×</button>
    </div>
    <div id="map"></div>
    <p id="location-status" class="status"></p>
  </div>

  <!-- Leaflet's code. Loaded before app.js because app.js uses it. -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Our app. type="module" lets it use "import". -->
  <script type="module" src="app.js"></script>
</body>
</html>
